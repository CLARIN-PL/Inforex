<!doctype html><meta charset="utf-8"><title>Metadata batch regression</title>
<link rel="stylesheet" href="../../public_html/libs/bootstrap/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="../../public_html/libs/handsontable-0.19.0/handsontable.full.min.css">
<button id="save_data_button" type="button">Save</button><input class="autosave" type="checkbox"><div id="hot-container"></div><input id="search_field">
<div class="modal ajax_error_modal" id="ajax_error_modal"><div class="modal-dialog"><div class="modal-content"><div class="ajax-error-modal-card"><h3 id="ajax_error_heading"></h3><div class="ajax-error-modal-details-label">Technical details</div><pre id="ajax_error_message_code"></pre></div><button type="button" class="ajax-error-copy-button">Copy details</button></div></div></div>
<div class="modal ajax_error_modal" id="ajax_access_error_modal"><div class="modal-dialog"><div class="modal-content"><div class="ajax-error-modal-card"><h3 id="ajax_error_message"></h3><div id="ajax_roles_required"></div><div id="ajax_roles_granted"></div></div><button type="button" class="ajax-error-copy-button">Copy details</button></div></div></div>
<pre id="result">RUNNING</pre>
<script src="../../public_html/libs/jquery.1.11.min.js"></script>
<script src="../../public_html/libs/bootstrap/dist/js/bootstrap.min.js"></script>
<script src="../../public_html/libs/handsontable-0.19.0/handsontable.full.min.js"></script>
<script>
var requests=[], passed=[], copied='';
$.url=function(){return {param:function(){return '157';}};}; $.cookie=function(){return null;};
function doAjax(action,params,success,error,complete){
 if(action==='metadata_batch_edit_get') success({documents:[{Report_ID:10,Title:'B'},{Report_ID:11,Title:'A'}],columns:[{field:'Report_ID'},{field:'Title'}]});
 if(action==='metadata_batch_edit_update') requests.push({params:params,success:success,complete:complete});
}
function check(ok,name){if(!ok)throw Error(name);passed.push(name);}
window.onerror=function(message){document.getElementById('result').textContent=JSON.stringify({error:message,passed:passed});};
</script>
<script src="../../public_html/js/page_corpus_metadata_batch_edit.js"></script>
<script src="../../public_html/js/error_modal.js"></script>
<script>
$(function(){(async function(){try {
 check(Object.keys(changed_docs.docs).length===0,'load does not create edits');
 hot.getPlugin('columnSorting').sortByColumn(1,true);
 check(hot.getDataAtRowProp(0,'Report_ID')===11,'fixture is sorted');
 hot.setDataAtRowProp(0,'Title','Edited');
 check(changed_docs.docs['11_Title'].value==='Edited' && !changed_docs.docs['10_Title'],'sorted edit maps to displayed document');
 saveMetadataChanges();var first=requests[0];
 check(first.params.corpus_id==='157' && first.params.url==='corpus=157','save carries corpus context');
 check(JSON.parse(first.params.docs_json)['11_Title'].value==='Edited','snapshot contains edited value');
 hot.setDataAtRowProp(0,'Title','Newer');saveMetadataChanges();
 check(requests.length===1,'inflight save is serialized');
 first.success();first.complete();
 check(requests.length===2 && JSON.parse(requests[1].params.docs_json)['11_Title'].value==='Newer','edit during save is queued and retained');
 requests[1].complete();
 check(changed_docs.docs['11_Title'].value==='Newer','failed save retains pending edit');
 saveMetadataChanges();requests[2].success();requests[2].complete();
 check(Object.keys(changed_docs.docs).length===0,'successful retry clears saved edits');
 hot.setDataAtRowProp(0,'Title',hot.getDataAtRowProp(0,'Title'));
 check(Object.keys(changed_docs.docs).length===0,'unchanged cell creates no pending write');
 for(var i=1;i<=6000;i++)changed_docs.docs[i+'_Title']={value:'Synthetic '+i};
 saveMetadataChanges();var bulk=requests[3];
 check(Object.keys(bulk.params).length===3 && Object.keys(JSON.parse(bulk.params.docs_json)).length===6000,'6000 cells use one JSON field');
 bulk.success();bulk.complete();
 Object.defineProperty(navigator,'clipboard',{configurable:true,value:{writeText:function(text){copied=text;return Promise.resolve();}}});
 generateErrorModal('Data transmission error:','502 Bad Gateway');
 var count=requests.length;$('#ajax_error_modal .ajax-error-copy-button').click();await Promise.resolve();
 check(copied.indexOf('502 Bad Gateway')>=0,'generic error copied');
 check(requests.length===count,'copy does not submit metadata');
 generateAccessErrorModal({error_msg:{message:'Access denied to metadata save',rolesGranted:['public_user'],rolesRequired:['manager']}});
 check(!$('#ajax_error_modal').hasClass('in') && $('#ajax_access_error_modal').hasClass('in'),'only latest error modal is open');
 $('#ajax_access_error_modal .ajax-error-copy-button').click();await Promise.resolve();
 check(copied.indexOf('Access denied')>=0 && copied.indexOf('manager')>=0 && copied.indexOf('502')<0,'access error copies its own details and roles');
 navigator.clipboard.writeText=function(){return Promise.reject(Error('Clipboard denied'));};
 document.execCommand=function(command){check(command==='copy' && document.activeElement.closest('#ajax_access_error_modal'),'clipboard fallback stays inside focused modal');copied=document.activeElement.value;return true;};
 $('#ajax_access_error_modal .ajax-error-copy-button').click();await Promise.resolve();await Promise.resolve();
 check(copied.indexOf('Access denied')>=0 && requests.length===count,'clipboard denial falls back without a save');
 hot.destroy();changed_docs.docs={};
 var columns=getMetadataColumnNames([{field:'Report_ID'},{field:'klasyfikacja_podstawowa',type:'enum',null:'Yes',field_values:['Tekst literacki prozą','Tekst literacki wierszowany','Literatura stosowana']},{field:'required_choice',type:'enum',null:'No',field_values:['A','B']}]);
 generateMetadataTable([{Report_ID:10,klasyfikacja_podstawowa:'Literatura stosowana',required_choice:'A'}],columns.columnHeaders,columns.columnOrder);
 function edit(prop,value){hot.setDataAtRowProp(0,prop,value);return new Promise(function(resolve){setTimeout(resolve,40);});}
 await edit('klasyfikacja_podstawowa','Tekst literacki prozą');
 check(hot.getDataAtRowProp(0,'klasyfikacja_podstawowa')==='Tekst literacki prozą' && changed_docs.docs['10_klasyfikacja_podstawowa'].value==='Tekst literacki prozą','enum selection retains Polish characters');
 await edit('klasyfikacja_podstawowa','Unknown');
 check(hot.getDataAtRowProp(0,'klasyfikacja_podstawowa')==='Tekst literacki prozą' && changed_docs.docs['10_klasyfikacja_podstawowa'].value==='Tekst literacki prozą','invalid dropdown value cannot enter pending saves');
 await edit('klasyfikacja_podstawowa','');
 check(hot.getDataAtRowProp(0,'klasyfikacja_podstawowa')==='' && changed_docs.docs['10_klasyfikacja_podstawowa'].value==='','nullable dropdown can be cleared');
 await edit('required_choice','');
 check(hot.getDataAtRowProp(0,'required_choice')==='A' && !changed_docs.docs['10_required_choice'],'required dropdown rejects empty choice');
 await edit('required_choice','Unknown');
 check(hot.getDataAtRowProp(0,'required_choice')==='A' && !changed_docs.docs['10_required_choice'],'required dropdown retains enum validator');
 await edit('required_choice','B');
 check(hot.getDataAtRowProp(0,'required_choice')==='B' && changed_docs.docs['10_required_choice'].value==='B','required dropdown accepts a listed choice');
 $('#ajax_access_error_modal').modal('hide');
 changed_docs.docs={};requests=[];
 await edit('klasyfikacja_podstawowa',null);
 changed_docs.docs={};
 hot.selectCell(0,1);
 var ed=hot.getActiveEditor();ed.beginEditing();
 await new Promise(function(r){setTimeout(r,100);});
 ed.htEditor.selectCell(1,0);
 ed.htEditor.runHooks('afterOnCellMouseDown');
 await new Promise(function(r){setTimeout(r,100);});
 check(hot.getDataAtRowProp(0,'klasyfikacja_podstawowa')==='Tekst literacki wierszowany','actual dropdown commits selected option');
 $('#save_data_button').click();
 check(requests.length===1 && JSON.parse(requests[0].params.docs_json)['10_klasyfikacja_podstawowa'].value==='Tekst literacki wierszowany','actual dropdown selection sends chosen value');
 requests[0].success();requests[0].complete();
 hot.selectCell(0,1);ed=hot.getActiveEditor();ed.beginEditing();
 await new Promise(function(r){setTimeout(r,100);});
 ed.htEditor.selectCell(2,0);
 // Mousedown outside the table commits asynchronously, then click invokes save.
 document.getElementById('save_data_button').dispatchEvent(new MouseEvent('mousedown',{bubbles:true}));
 $('#save_data_button').click();
 await new Promise(function(r){setTimeout(r,100);});
 check(requests.length===2 && JSON.parse(requests[1].params.docs_json)['10_klasyfikacja_podstawowa'].value==='Literatura stosowana','save during dropdown edit sends final choice');

 requests[1].success();requests[1].complete();
 autosave=true;
 hot.selectCell(0,1);ed=hot.getActiveEditor();ed.beginEditing();
 await new Promise(function(r){setTimeout(r,100);});
 ed.htEditor.selectCell(0,0);ed.htEditor.runHooks('afterOnCellMouseDown');
 await new Promise(function(r){setTimeout(r,100);});
 check(requests.length===3 && JSON.parse(requests[2].params.docs_json)['10_klasyfikacja_podstawowa'].value==='Tekst literacki prozą','autosave waits for dropdown validation and sends once');
 requests[2].success();requests[2].complete();autosave=false;
 // Also flush a choice when Save is activated while the editor is still open.
 hot.selectCell(0,1);ed=hot.getActiveEditor();ed.beginEditing();
 await new Promise(function(r){setTimeout(r,100);});
 ed.htEditor.selectCell(1,0);saveMetadataChanges();saveMetadataChanges();
 await new Promise(function(r){setTimeout(r,100);});
 check(requests.length===4 && JSON.parse(requests[3].params.docs_json)['10_klasyfikacja_podstawowa'].value==='Tekst literacki wierszowany','repeated save during open dropdown commits once');
 requests[3].success();requests[3].complete();
 // Invalid edits must not trigger a save of an older buffered value.
 hot.selectCell(0,2);ed=hot.getActiveEditor();ed.beginEditing();
 await new Promise(function(r){setTimeout(r,100);});
 ed.htEditor.deselectCell();ed.setValue('Unknown');saveMetadataChanges();
 await new Promise(function(r){setTimeout(r,100);});
 check(requests.length===4 && !metadataSaveWaitingForEditor && ed.isOpened(),'invalid choice keeps editor open and does not save');
 ed.htEditor.selectCell(0,0);saveMetadataChanges();
 await new Promise(function(r){setTimeout(r,100);});
 check(requests.length===5 && JSON.parse(requests[4].params.docs_json)['10_required_choice'].value==='A','corrected choice can be saved after rejected edit');
 requests[4].success();requests[4].complete();
 hot.destroy();document.getElementById('result').textContent=JSON.stringify({passed:passed.length,checks:passed});
} catch(e){document.getElementById('result').textContent=JSON.stringify({error:String(e),passed:passed});}})();});
</script>
